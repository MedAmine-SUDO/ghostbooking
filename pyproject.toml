[project]
name = "ghostbooking"
version = "0.1.1"
description = "Clears ghost bookings from a shared Excel room-booking file every morning and reminds people on Slack, Teams, Discord or email."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MedAmine-SUDO" }]
requires-python = ">=3.12"
keywords = ["meeting rooms", "room booking", "excel", "google sheets", "slack", "teams", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/MedAmine-SUDO/ghostbooking"
Source = "https://github.com/MedAmine-SUDO/ghostbooking"
Issues = "https://github.com/MedAmine-SUDO/ghostbooking/issues"
Changelog = "https://github.com/MedAmine-SUDO/ghostbooking/blob/main/CHANGELOG.md"

[project.scripts]
ghostbooking = "ghostbooking.cli:main"

[project.optional-dependencies]
google = [
    "gspread>=6.1",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

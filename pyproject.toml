[project]
name = "ghostbooking"
version = "0.1.0"
description = "Clears ghost bookings from a shared Excel room-booking file every morning and reminds people on Slack, Teams, Discord or email."
readme = "README.md"
license = "MIT"
authors = [{ name = "MedAmine-SUDO" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
ghostbooking = "ghostbooking.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
